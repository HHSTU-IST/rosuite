[project]
name = "rosuite"
version = "0.1.0"
description = "Python bindings for the rosuite C++ libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
]

[build-system]
requires = [
  "pybind11>=3.0.0",
  "scikit-build-core>=0.12.0",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = ">=3.20"
wheel.packages = ["python/rosuite"]
sdist.include = [
  "README.md",
  "CMakeLists.txt",
  "CMakePresets.json",
  "cmake/**",
  "core/**",
  "models/**",
  "filters/**",
  "tracking/**",
  "apps/**",
  "python/**",
]

[tool.scikit-build.cmake.define]
ROSUITE_BUILD_PYTHON = "ON"
ROSUITE_BUILD_TESTS = "OFF"

[tool.uv]
package = true
